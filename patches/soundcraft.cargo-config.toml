# Used by install.sh only (copied to .cargo/config.toml of the app before the build).
#
# With the macOS 10.15 SDK the linker does not know AudioHardwareCreateProcessTap and
# AudioHardwareDestroyProcessTap, CoreAudio functions for capturing system audio that exist only on
# newer macOS (process taps, macOS 14.2+). The audio library (cpal) references them from its
# loopback device code, so the link stops with "Undefined symbols". -U lets the linker leave them
# to be resolved at runtime; they are only looked up when the functions are really called, i.e.
# when a loopback (system audio) device is used. The GitHub workflow does not need this file: its
# runner has a newer SDK.
[target.x86_64-apple-darwin]
rustflags = [
  "-C", "link-arg=-Wl,-U,_AudioHardwareCreateProcessTap",
  "-C", "link-arg=-Wl,-U,_AudioHardwareDestroyProcessTap",
]
